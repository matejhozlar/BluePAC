org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 1.0.1
mod_id = bluepac
mod_name = BluePAC
mod_authors = saunhardy
mod_license = MIT
mod_description = BlueMap integration with Open Parties and Claims. Displays claimed chunks as markers on your BlueMap.
maven_group = com.saunhardy.bluepac
archives_name = bluepac
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1
minecraft_version_range = [1.20.1,1.21)

# Forge
forge_version = 1.20.1-47.4.10
forge_version_range = [47,)
loader_version_range = [47,)

# Fabric
fabric_loader_version = 0.16.14
fabric_api_version = 0.92.6+1.20.1

# Mod dependencies
# OpenPAC API version (Modrinth). Same upstream version the original 1.21.1 build used.
opac_version = 0.25.10
# BlueMap API (loader-independent, from BlueColored maven).
# 2.7.2 is the last API release built for Java 16/17; 2.7.3+ require Java 21.
# Uses the legacy coordinate de.bluecolored.bluemap:BlueMapAPI (see common/build.gradle).
bluemap_api_version = 2.7.2
flowmath_version = 1.0.3

# Shared libs
# Cross-loader config backend, shadowed into the Fabric jar (Forge ships it already).
nightconfig_version = 3.6.7
